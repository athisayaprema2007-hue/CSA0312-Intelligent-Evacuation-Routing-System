name: Add full source code appendix to report

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-full-code-report.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install document tools
        run: |
          python -m pip install --upgrade pip
          pip install python-docx
          sudo apt-get update
          sudo apt-get install -y libreoffice fonts-dejavu-core

      - name: Restore appendix builder
        shell: bash
        run: |
          echo '' | base64 -d | gunzip > /tmp/add_full_code.py
          python -m py_compile /tmp/add_full_code.py

      - name: Add full source code appendix
        run: |
          python /tmp/add_full_code.py report/CSA0312_Final_Assignment_Report.docx . report/CSA0312_Final_Assignment_Report.docx

      - name: Export PDF
        run: |
          rm -f report/CSA0312_Final_Assignment_Report.pdf
          libreoffice --headless --convert-to pdf --outdir report report/CSA0312_Final_Assignment_Report.docx
          test -s report/CSA0312_Final_Assignment_Report.pdf

      - name: Verify appendix and faculty structure
        run: |
          python - <<'PY2'
          from docx import Document
          doc=Document('report/CSA0312_Final_Assignment_Report.docx')
          para=chr(10).join(p.text for p in doc.paragraphs)
          tables=chr(10).join(c.text for t in doc.tables for r in t.rows for c in r.cells)
          text=para+chr(10)+tables
          faculty=[
            'A. Student Work','1. Problem Understanding and Formulation','2. Application of Course Knowledge',
            '3. Solution / Design / Methodology','4. Use of Modern Tools','5. Results and Validation',
            '6. Analysis and Engineering Decision','7. Broader Considerations','8. Conclusion','9. Student Reflection','10. References'
          ]
          for h in faculty:
              assert h in para, f'Missing faculty heading: {h}'
          assert 'Appendix A. Full Source Code' in para
          files=['src/graph.h','src/graph.c','src/hashmap.h','src/hashmap.c','src/hashset.h','src/hashset.c','src/minheap.h','src/minheap.c','src/dijkstra.h','src/dijkstra.c','src/route_cache.h','src/route_cache.c','src/console_ui.h','src/console_ui.c','src/main.c','tests/test_runner.c']
          for f in files:
              assert f in para, f'Missing appendix file heading: {f}'
          for token in ['8,200','21,000','16 / 16 PASS','3.91 ms','7.000 ms','0.00003 ms','6,300','8,026','174','+3 to +175']:
              assert token in text, f'Missing verified value: {token}'
          assert len(doc.inline_shapes) >= 4, 'Architecture diagram / terminal screenshots missing'
          print('Faculty structure + full source appendix verified')
          PY2

      - name: Commit updated report
        run: |
          git config user.name 'athisayaprema2007-hue'
          git config user.email 'athisayaprema2007@gmail.com'
          git add report/CSA0312_Final_Assignment_Report.docx report/CSA0312_Final_Assignment_Report.pdf
          if git diff --cached --quiet; then
            echo 'No report changes to commit.'
          else
            git commit -m 'Add full source code appendix to report'
            git push
          fi
