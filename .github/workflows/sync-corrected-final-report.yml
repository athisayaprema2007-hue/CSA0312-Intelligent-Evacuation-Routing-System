name: Sync corrected final report

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-corrected-final-report.yml'

permissions:
  contents: write

jobs:
  sync-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: pip install pypdf pillow

      - name: Insert corrected Floyd working
        run: |
          cat > /tmp/finalize.py <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          from pypdf import PdfReader, PdfWriter

          report = Path('report/CSA0312_Final_Assignment_Report.pdf')
          temp = Path('/tmp/final_report.pdf')
          W, H = 1700, 2200
          BLUE=(30,55,125); PAPER=(249,248,244); GREY=(120,120,120)
          font_path='/usr/share/fonts/truetype/dejavu/DejaVuSans-Oblique.ttf'
          if not Path(font_path).exists(): font_path='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          def F(n): return ImageFont.truetype(font_path,n)
          def T(d,x,y,s,n=29): d.text((x,y),s,font=F(n),fill=BLUE)
          def page():
              im=Image.new('RGB',(W,H),PAPER); d=ImageDraw.Draw(im)
              d.rectangle((35,35,W-35,H-35),outline=GREY,width=2)
              return im,d
          def matrix(d,x,y,a,sz=25,cw=88,rh=48):
              for j in range(5): T(d,x+80+j*cw,y-42,str(j+1),sz-3)
              for i in range(5): T(d,x,y+i*rh,str(i+1),sz-3)
              bx=x+55; by=y-6; rx=bx+5*cw+25; bot=by+5*rh+12
              d.line((bx,by,bx,bot),fill=BLUE,width=3); d.line((bx,by,bx+18,by),fill=BLUE,width=3); d.line((bx,bot,bx+18,bot),fill=BLUE,width=3)
              d.line((rx,by,rx,bot),fill=BLUE,width=3); d.line((rx-18,by,rx,by),fill=BLUE,width=3); d.line((rx-18,bot,rx,bot),fill=BLUE,width=3)
              for i,row in enumerate(a):
                  for j,v in enumerate(row): T(d,x+78+j*cw,y+i*rh,str(v),sz)
          def graph(d,x,y):
              pts={1:(x,y),2:(x+330,y),3:(x,y+185),4:(x+330,y+185),5:(x+560,y+185)}
              for a,b,w in [(1,2,4),(1,3,1),(3,2,2),(2,4,5),(3,4,12),(4,5,3)]:
                  xa,ya=pts[a]; xb,yb=pts[b]; d.line((xa,ya,xb,yb),fill=BLUE,width=3); T(d,(xa+xb)//2+8,(ya+yb)//2-30,str(w),24)
              for n,(px,py) in pts.items():
                  d.ellipse((px-27,py-27,px+27,py+27),outline=BLUE,width=3); T(d,px-8,py-17,str(n),24)
          inf='∞'
          D0=[['0','4','1',inf,inf],['4','0','2','5',inf],['1','2','0','12',inf],[inf,'5','12','0','3'],[inf,inf,inf,'3','0']]
          D1=[r[:] for r in D0]
          D2=[['0','4','1','9',inf],['4','0','2','5',inf],['1','2','0','7',inf],['9','5','7','0','3'],[inf,inf,inf,'3','0']]
          D3=[['0','3','1','8',inf],['3','0','2','5',inf],['1','2','0','7',inf],['8','5','7','0','3'],[inf,inf,inf,'3','0']]
          D4=[['0','3','1','8','11'],['3','0','2','5','8'],['1','2','0','7','10'],['8','5','7','0','3'],['11','8','10','3','0']]

          im,d=page(); T(d,75,65,'Floyd-Warshall numerical - Page 1',42); graph(d,270,190)
          T(d,80,470,'K = 0  Initial distance matrix',32); matrix(d,380,520,D0)
          T(d,80,855,'K = 1  (using vertex 1)',32)
          y=915
          for s in ['A0[23]: min(2, 4+1) = 2','A0[24]: min(5, 4+∞) = 5','A0[25]: min(∞, 4+∞) = ∞','A0[32]: min(2, 1+4) = 2','A0[34]: min(12, 1+∞) = 12','No shorter route is produced through vertex 1, so A1 = A0.']:
              T(d,105,y,s,27); y+=62
          T(d,80,1320,'K = 1 matrix',31); matrix(d,380,1370,D1,23,82,43)
          T(d,80,1650,'K = 2  (using vertex 2)',32)
          for y,s in [(1710,'A1[14] = min(∞, 4+5) = 9'),(1770,'A1[34] = min(12, 2+5) = 7'),(1830,'By symmetry: A2[41] = 9 and A2[43] = 7.')]: T(d,105,y,s,27)
          T(d,80,1940,'K = 2 matrix',31); matrix(d,380,1980,D2,23,82,38)
          im.save('/tmp/floyd1.pdf','PDF',resolution=200)

          im,d=page(); T(d,75,65,'Floyd-Warshall numerical - Page 2',42)
          T(d,80,145,'K = 3  (using vertex 3)',32)
          y=205
          for s in ['A2[12] = min(4, 1+2) = 3','A2[14] = min(9, 1+7) = 8','A2[21] = min(4, 2+1) = 3','A2[41] = min(9, 7+1) = 8','IMPORTANT: distances to vertex 5 are still ∞ at K = 3.']:
              T(d,105,y,s,27); y+=62
          T(d,80,535,'K = 3 matrix',31); matrix(d,380,580,D3)
          T(d,80,920,'K = 4  (using vertex 4)',32)
          y=980
          for s in ['A3[15] = min(∞, 8+3) = 11','A3[25] = min(∞, 5+3) = 8','A3[35] = min(∞, 7+3) = 10','By symmetry: A4[51]=11, A4[52]=8, A4[53]=10.']:
              T(d,105,y,s,27); y+=62
          T(d,80,1245,'K = 4 matrix',31); matrix(d,380,1290,D4)
          T(d,80,1655,'K = 5  (using vertex 5)',32); T(d,105,1715,'No further improvement is possible.',28)
          T(d,80,1780,'K = 5 final all-pairs shortest-path matrix',31); matrix(d,380,1830,D4,23,82,40)
          d.rectangle((115,2070,W-115,2160),outline=BLUE,width=3); T(d,145,2090,'Hence, A5 is the final all-pairs shortest-path matrix.',27)
          im.save('/tmp/floyd2.pdf','PDF',resolution=200)

          r=PdfReader(str(report)); base=len(r.pages)
          if base < 18: raise SystemExit(f'Unexpected base report page count: {base}')
          w=PdfWriter()
          for i,p in enumerate(r.pages,1):
              w.add_page(p)
              if i==14:
                  w.add_page(PdfReader('/tmp/floyd1.pdf').pages[0])
                  w.add_page(PdfReader('/tmp/floyd2.pdf').pages[0])
          if len(w.pages) != base+2: raise SystemExit('Page insertion verification failed')
          with open(temp,'wb') as f: w.write(f)
          temp.replace(report)
          print(f'base_pages={base}; final_pages={base+2}')
          PY
          python /tmp/finalize.py

      - name: Verify and commit final report
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          p='report/CSA0312_Final_Assignment_Report.pdf'
          r=PdfReader(p)
          assert len(r.pages) >= 65
          print('verified pages:', len(r.pages))
          PY
          git config user.name 'athisayaprema2007-hue'
          git config user.email 'athisayaprema2007@gmail.com'
          rm -rf .sync .github/workflows/sync-corrected-final-report.yml
          git add -A
          git commit -m 'Sync verified final report with corrected Floyd working'
          git push
