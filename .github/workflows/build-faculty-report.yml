name: Build faculty-aligned assignment report

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-faculty-report.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install document tools
        run: |
          python -m pip install --upgrade pip
          pip install python-docx pillow
          sudo apt-get update
          sudo apt-get install -y libreoffice fonts-dejavu-core

      - name: Restore report builder
        shell: bash
        run: |
          echo '' | base64 -d | gunzip > /tmp/build_report.py
          python -m py_compile /tmp/build_report.py

      - name: Build Word report
        run: python /tmp/build_report.py

      - name: Export PDF
        run: |
          libreoffice --headless --convert-to pdf --outdir report report/CSA0312_Final_Assignment_Report.docx
          test -s report/CSA0312_Final_Assignment_Report.pdf

      - name: Verify required faculty structure and preserved values
        run: |
          python - <<'PY'
          from docx import Document
          doc=Document('report/CSA0312_Final_Assignment_Report.docx')
          text='\n'.join(p.text for p in doc.paragraphs)
          headings=[
            'A. Student Work',
            '1. Problem Understanding and Formulation',
            '2. Application of Course Knowledge',
            '3. Solution / Design / Methodology',
            '4. Use of Modern Tools',
            '5. Results and Validation',
            '6. Analysis and Engineering Decision',
            '7. Broader Considerations',
            '8. Conclusion',
            '9. Student Reflection',
            '10. References'
          ]
          positions=[]
          for h in headings:
              i=text.find(h)
              assert i >= 0, f'Missing heading: {h}'
              positions.append(i)
          assert positions == sorted(positions), 'Faculty headings are not in the required order'
          required=['8,200','21,000','42,000','16 / 16 PASS','3.91 ms','7.000 ms','0.00003 ms','6,300','8,026','174','+3 to +175']
          for token in required:
              assert token in text, f'Missing value: {token}'
          assert 'ChatGPT and Claude were used as AI-assisted tools' in text
          print('Faculty structure and technical values verified')
          PY

      - name: Commit generated report
        run: |
          git config user.name 'athisayaprema2007-hue'
          git config user.email 'athisayaprema2007@gmail.com'
          git add report/CSA0312_Final_Assignment_Report.docx report/CSA0312_Final_Assignment_Report.pdf
          if git diff --cached --quiet; then
            echo 'No generated report changes.'
          else
            git commit -m 'Align report with faculty assignment structure'
            git push
          fi
